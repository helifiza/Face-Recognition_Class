services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendance}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://attendance:${POSTGRES_PASSWORD:-attendance}@db:5432/attendance
      SIM_THRESHOLD: "0.75"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
